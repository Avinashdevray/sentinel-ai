<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DummyBank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🏦 DummyBank</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="login.html" class="btn-login">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <div class="login-header">
                    <h1>Welcome Back</h1>
                    <p>Login to access your account</p>
                </div>

                <div class="tabs">
                    <button class="tab-button active" onclick="showTab('login')">Login</button>
                    <button class="tab-button" onclick="showTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <div id="login-tab" class="tab-content active">
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="login-username">Username</label>
                            <input type="text" id="login-username" name="username" value="demo" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" value="demo123" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                        <div id="login-message" class="message"></div>
                    </form>
                    <div class="form-footer">
                        <p>Demo Credentials: username=<strong>demo</strong>, password=<strong>demo123</strong></p>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="register-tab" class="tab-content">
                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label for="register-username">Username</label>
                            <input type="text" id="register-username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="register-email">Email</label>
                            <input type="email" id="register-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="register-fullname">Full Name</label>
                            <input type="text" id="register-fullname" name="full_name" required>
                        </div>
                        <div class="form-group">
                            <label for="register-password">Password</label>
                            <input type="password" id="register-password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="register-confirm-password">Confirm Password</label>
                            <input type="password" id="register-confirm-password" name="confirm_password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Register</button>
                        <div id="register-message" class="message"></div>
                    </form>
                </div>
            </div>

            <!-- Dashboard Preview (shown after login) -->
            <div id="dashboard" class="dashboard" style="display: none;">
                <div class="dashboard-header">
                    <h2>Welcome, <span id="user-name"></span>! 👋</h2>
                    <button onclick="logout()" class="btn btn-secondary">Logout</button>
                </div>

                <div class="accounts-section">
                    <h3>Your Accounts</h3>
                    <div id="accounts-list" class="accounts-list">
                        <!-- Accounts will be loaded here -->
                    </div>
                </div>

                <div class="actions-section">
                    <h3>Quick Actions</h3>
                    <div class="actions-grid">
                        <!-- Deposit -->
                        <div class="action-card">
                            <h4>💰 Deposit</h4>
                            <form id="depositForm" class="quick-action-form">
                                <select id="deposit-account" name="account_number" required>
                                    <option value="">Select Account</option>
                                </select>
                                <input type="number" name="amount" placeholder="Amount" step="0.01" min="0.01" required>
                                <button type="submit" class="btn btn-primary">Deposit</button>
                            </form>
                            <div id="deposit-message" class="message"></div>
                        </div>

                        <!-- Withdraw -->
                        <div class="action-card">
                            <h4>💸 Withdraw</h4>
                            <form id="withdrawForm" class="quick-action-form">
                                <select id="withdraw-account" name="account_number" required>
                                    <option value="">Select Account</option>
                                </select>
                                <input type="number" name="amount" placeholder="Amount" step="0.01" min="0.01" required>
                                <button type="submit" class="btn btn-primary">Withdraw</button>
                            </form>
                            <div id="withdraw-message" class="message"></div>
                        </div>

                        <!-- Transfer -->
                        <div class="action-card">
                            <h4>🔄 Transfer</h4>
                            <form id="transferForm" class="quick-action-form">
                                <select id="transfer-from" name="from_account" required>
                                    <option value="">From Account</option>
                                </select>
                                <input type="text" name="to_account" placeholder="To Account Number" required>
                                <input type="number" name="amount" placeholder="Amount" step="0.01" min="0.01" required>
                                <input type="text" name="description" placeholder="Description (optional)">
                                <button type="submit" class="btn btn-primary">Transfer</button>
                            </form>
                            <div id="transfer-message" class="message"></div>
                        </div>
                    </div>
                </div>

                <div class="transactions-section">
                    <h3>Recent Transactions</h3>
                    <div id="transactions-list" class="transactions-list">
                        <!-- Transactions will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 DummyBank. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
